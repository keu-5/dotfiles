# tmux 設定
#
# 実体は dotfiles/.config/tmux/tmux.conf。tmux-manager/setup-tmux.sh が
# ~/.config/tmux へシンボリックリンクを張る。
#
# 想定バージョンは tmux 3.2a（Ubuntu 22.04 の apt 版）。
# 以下の各行は、3.2a の既定値を実際に確認したうえで「既定のままでは困るもの」だけを書いている。
# 既定値のコメントは `tmux show-options -g -A` / `-s -A` / `-w -g -A` の出力に基づく。

# ---- 端末と色 --------------------------------------------------------------

# 既定は screen。tmux 自身が持つ機能（256色、イタリック等）を中のアプリへ正しく伝えるため、
# tmux 用の terminfo に変える。
# ※ tmux-256color の terminfo が無い環境では tmux が起動しない。その場合は
#    screen-256color に戻すか、ncurses-term 相当を入れる。
set -g default-terminal "tmux-256color"

# 外側の端末（Ghostty, iTerm2 など xterm 系）が 24bit 色を扱えることを tmux に教える。
# これが無いと truecolor が 256 色に丸められ、nvim の配色が意図と変わる。
# terminal-features は tmux 3.2 以降のオプション。
set -as terminal-features ",xterm*:RGB"

# ---- 反応と履歴 ------------------------------------------------------------

# 3.2a の既定は 500ms。Esc を押したあと tmux が「Esc 単独か、Esc から始まるキー列か」を
# 待つ時間で、そのぶん nvim のモード切り替えが遅れる。0 にすると遅い回線で本物のキー列を
# 取りこぼすので 10ms（tmux 自身も 3.5 でこの値を既定に変更している）。
set -s escape-time 10

# 既定 2000 行。Claude Code の長い出力を遡れるようにする。
# 1ペインあたりの上限なので、増やすとそのぶんメモリを使う。
set -g history-limit 50000

# 既定 off。スクロール、ペインの選択、境界のドラッグをマウスでできるようにする。
# ※ 有効にすると端末側の文字選択が tmux に横取りされる。端末側で選択したいときは
#    Shift を押しながらドラッグする。
set -g mouse on

# ---- ウィンドウ番号 --------------------------------------------------------

# 既定は 0 始まり。キーボードの数字の並びに合わせて 1 始まりにする。
set -g base-index 1
setw -g pane-base-index 1

# 既定 off。ウィンドウを閉じたときに番号を詰める（off だと 1,3,4 のように穴が残る）。
set -g renumber-windows on

# ---- 外側アプリとの連携 ----------------------------------------------------

# 既定 external（tmux から端末への設定は行うが、中のアプリからの OSC52 は無視する）。
# on にすると、SSH 先の nvim などが tmux 越しに手元PCのクリップボードへコピーできる。
# 端末の terminfo に Ms（OSC52）が必要。tmux-256color / xterm-256color には含まれている。
set -s set-clipboard on

# 既定 off。ウィンドウのフォーカスの出入りを中のアプリへ伝える（nvim の autoread 等）。
set -s focus-events on

# コピーモードの移動キーを vi 風にする（既定 emacs）。nvim に合わせる。
setw -g mode-keys vi

# ---- キー ------------------------------------------------------------------

# prefix は既定の C-b のまま（C-a は行頭移動と衝突するため変えない）。
# 設定を書き換えたら prefix r で読み直す。
# パスは setup-tmux.sh が張る ~/.config/tmux/tmux.conf 前提（tmux 3.1 未満で
# ~/.tmux.conf 側にリンクした場合は、そちらを source-file すること）。
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ---- 検討して入れなかったもの ----------------------------------------------
#
# aggressive-resize : 既定の window-size latest（直近に操作したクライアントの
#                     サイズを使う）で足りる。man も「シェルのような対話プログラムには
#                     不向き」としている。
# allow-passthrough : tmux 3.3 以降のオプションで 3.2a には存在しない。
# プラグイン管理(TPM): SSH 切断に耐えるという目的に不要。依存を増やさない。
# destroy-unattached: 既定 off のままでよい。これが on だと detach した瞬間に
#                     セッションが消え、今回の目的そのものが壊れる。
